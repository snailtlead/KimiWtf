name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write  # публикация coverage.json в ветку badges

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff

      - name: Ruff
        run: ruff check . --output-format=github

      - name: "Tests with coverage (gate: 90%)"
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Generate coverage badge payload
        if: matrix.python-version == '3.14' && github.event_name == 'push'
        run: |
          python - <<'EOF'
          import json, re
          rate = float(re.search(r'line-rate="([\d.]+)"', open('coverage.xml').read()).group(1))
          pct = round(rate * 100)
          color = 'brightgreen' if pct >= 90 else 'green' if pct >= 70 else 'yellow' if pct >= 50 else 'red'
          json.dump({'schemaVersion': 1, 'label': 'coverage', 'message': f'{pct}%', 'color': color},
                    open('/tmp/coverage.json', 'w'))
          print(f'coverage: {pct}% ({color})')
          EOF

      - name: Publish badge to badges branch
        if: matrix.python-version == '3.14' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          if git rev-parse --verify --quiet origin/badges; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf .
          fi
          cp /tmp/coverage.json coverage.json
          git add coverage.json
          git diff --cached --quiet || git commit -m "coverage: $(python -c "import json; print(json.load(open('coverage.json'))['message'])")"
          git push origin badges
